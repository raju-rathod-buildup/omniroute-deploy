# ══════════════════════════════════════════════════════════════════════════
#  OmniRoute — http://YOUR_HOST/omni  ->  127.0.0.1:20128
#
#  Included from the `default` server block (which owns the bare IP on :80).
#  Kept in its own file so this app's routing can change without editing the
#  shared block that also serves phpMyAdmin, netdata and the PHP root.
#
#  The image is BUILT with OMNIROUTE_BASE_PATH=/omni, so Next.js — and, more
#  importantly, the authz route matchers that enforce API keys — expect to
#  receive the /omni prefix. proxy_pass therefore has NO trailing URI part,
#  which makes nginx forward the original path unchanged. Adding a trailing
#  slash would strip the prefix and break both routing and auth.
# ══════════════════════════════════════════════════════════════════════════

# Live-monitoring WebSocket: different backend port, so it must win the match.
location = /omni/live-ws {
    # Per-IP caps (zones: conf.d/omniroute-ws-limit.conf). Normal use is one
    # socket per open dashboard tab, so 40 concurrent / 60 new per minute
    # (burst 40) leaves headroom for several tabs behind one NAT while
    # stopping a reconnect storm before it reaches Node.
    limit_conn omni_ws_conn 40;
    limit_req  zone=omni_ws_req burst=40 nodelay;
    limit_conn_status 429;
    limit_req_status  429;

    proxy_pass http://127.0.0.1:20132;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ══════════════════════════════════════════════════════════════════════════
#  Doubled base path: /omni/omni/... -> /omni/...
#
#  ROOT CAUSE (upstream, src/shared/components/RequestLoggerV2.tsx):
#
#      const url = new URL(globalThis.location.href);  // /omni/dashboard/logs
#      url.searchParams.set("id", logEntry.id);
#      router.replace(url.pathname + url.search);      // router re-adds /omni
#
#  location.pathname still carries the deploy basePath, while Next's
#  router.replace() prepends it again — so opening any request row on
#  /omni/dashboard/logs navigated to /omni/omni/dashboard/logs?id=... and hard
#  404'd. Same defect in closeDetail(). Invisible upstream because basePath is
#  "" on a root deployment, which makes the doubled prefix a no-op there.
#
#  Observed 21 Aug 2026 03:45:00 — note the Referer is the correct page and the
#  _rsc= marks it as a Next client navigation, not a typed URL:
#      GET /omni/omni/dashboard/logs?id=1787283865768-1b9184&_rsc=e5qs6  404
#      Referer: http://YOUR_HOST/omni/dashboard/logs
#
#  The real fix is patches/0004-logs-deeplink-basepath.patch, which needs the
#  25-minute rebuild. This block makes the page work in the meantime and is
#  independent of the image, so it also survives an upgrade that reintroduces
#  the bug. It is safe to strip one prefix unconditionally: after Next strips
#  its own basePath there is no route named "omni" — the app's top-level
#  segments are (dashboard), api, auth, docs, login, status, the error codes,
#  etc. — so /omni/omni/* is never a legitimate path.
#
#  Collapses ANY depth, not just one level. Depth grows by one per navigation:
#  openDetail() writes /omni/omni/... into history, then closeDetail() re-reads
#  that already-doubled location.pathname and router.replace() prepends /omni
#  again -> /omni/omni/omni/... Reported live 21 Aug 2026. A single-level strip
#  left the app receiving /omni/omni/dashboard/logs, which still 404s.
#
#  `break` stops rewrite processing here rather than re-entering location
#  matching, so this cannot loop regardless of depth.
#
#  Cosmetic caveat: this repairs the request, not the address bar. The doubled
#  URL was already written to history by router.replace() before any request
#  left the browser, so it stays visible until the patch ships. The page,
#  the deep-linked modal and reloads all work.
# ══════════════════════════════════════════════════════════════════════════
location ^~ /omni/omni/ {
    rewrite ^(?:/omni)+(/.*)$ /omni$1 break;

    proxy_pass http://127.0.0.1:20128;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    client_max_body_size 100m;
}

# Dashboard, assets (/omni/_next/...) and the API (/omni/v1/..., /omni/api/v1/...).
location ^~ /omni {
    proxy_pass http://127.0.0.1:20128;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Streaming LLM responses are SSE — buffering would withhold tokens
    # until the whole generation finished.
    proxy_buffering off;
    proxy_cache off;

    # Long generations outlive nginx's 60s default.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    client_max_body_size 100m;
}

# ══════════════════════════════════════════════════════════════════════════
#  Dashboard API calls that arrive WITHOUT the /omni prefix
#
#  The client bundle attaches the prefix by monkey-patching the global fetch
#  (shared/utils/basePathFetch.ts, installed from app/layout.tsx:146 and
#  DashboardLayout.tsx:53). That patch is ref-counted and REMOVABLE: one
#  unbalanced effect cleanup restores the native fetch, and nothing ever
#  reinstalls it because the installing useInsertionEffect has an empty dep
#  array. From that moment every request in the tab is issued against the
#  ORIGIN ROOT and 404s here.
#
#  Observed live on 20 Aug 2026 — same page, same second (11:32:07):
#      GET /omni/api/providers/jina-ai/cc-alias   200
#      GET /api/providers                         404
#  That is what made "Add API key" report "API key validation failed" for a
#  Jina key the backend itself validated as good ({"valid":true}).
#
#  patches/0001-client-base-path-inline.patch fixed an earlier variant of the
#  same fragility (the patch never installing at all — 79k root 404s on 19 Aug
#  12:00-14:00). This block covers the runtime variant without another
#  25-minute, ~12 GB rebuild, and survives image upgrades.
#
#  SAFE TO OCCUPY /api/ ON THIS ROOT? Checked, yes — same reasoning as the
#  public/ asset blocks below. This snippet is included only by the `default`
#  server block (the bare IP); the named vhosts have their own blocks and are
#  unaffected. /var/www/html has no `api` directory, and the default block
#  declares no other /api location.
#
#  The prefix is re-attached BEFORE the app sees the request, so the authz
#  route matchers that enforce API keys still receive the /omni-prefixed path
#  and are unchanged by this block. It does mean the gateway API answers at the
#  origin root as well as under /omni; authentication is identical on both.
# ══════════════════════════════════════════════════════════════════════════
location ^~ /api/ {
    rewrite ^ /omni$uri break;

    proxy_pass http://127.0.0.1:20128;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Mirrors the /omni block: SSE must not be buffered, and long generations
    # outlive nginx's 60s default.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    client_max_body_size 100m;
}

# ══════════════════════════════════════════════════════════════════════════
#  public/ assets, served at the ORIGIN ROOT
#
#  ROOT CAUSE of the /providers/*.svg + favicon 404s in the browser console:
#  Next.js applies `basePath` to router links, /_next/static and (in this
#  version) metadata.manifest — but NOT to files in public/. Those URLs must
#  be prefixed by the application, and upstream OmniRoute hardcodes them at
#  the root: `<img src={`/providers/${id}.svg`}>` in ProviderIcon.tsx,
#  `icons: [{ url: "/favicon.ico" }, ...]` in layout.tsx, and the icon list
#  in manifest.ts. Proof from the served HTML of /omni/login — same metadata
#  object, only the manifest got the prefix:
#
#      <link rel="manifest" href="/omni/manifest.webmanifest"/>   <- prefixed
#      <link rel="icon"     href="/favicon.ico"/>                 <- NOT
#
#  ~140 such references exist across the compiled client and server chunks in
#  eight different syntactic shapes, some of which are display text rather
#  than URLs. Rewriting them in a derived image layer (the technique used by
#  Dockerfile.qdrant-vecfix) cannot satisfy that recipe's own `left === 0`
#  safety assertion at this scale, and a full `next build` peaks near 12 GB
#  RSS on this 16 GB host — it has OOM-killed neighbouring containers before.
#  So the prefix is re-attached here, at the proxy, which covers every shape
#  at once and keeps working across image upgrades.
#
#  There is deliberately no `patches/` entry for this one. The references are
#  not confined to a few components — ProviderIcon.tsx has three, but
#  shared/constants/cliTools.ts alone holds 48 more that reach the DOM through
#  four separate card components — so a source patch would be a wide refactor
#  that cannot be verified without the 25-minute rebuild it is meant to avoid.
#  This block covers all of them at once and is independent of the image, so
#  it keeps working after an upgrade rather than being wiped by one.
#
#  SAFE TO OCCUPY THESE ROOT PATHS? Checked, yes. This snippet is included
#  only by the `default` server block (the bare IP); the named vhosts have
#  their own blocks and are unaffected. /var/www/html has no directory or
#  file of any of these names, and its PHP sites reference their assets
#  relatively, not from the root.
# ══════════════════════════════════════════════════════════════════════════

# Provider logomarks — ProviderIcon.tsx. The reported 404s.
location ^~ /providers/ { include /etc/nginx/snippets/omniroute-public-asset.conf; }

# Referenced the same root-absolute way, and just as broken until now:
#   /images/tier-flow-{dark,light}.svg  — the tier diagram
#   /audio/ui-notify.mp3                — `new Audio("/audio/ui-notify.mp3")`,
#                                         which fails without any console error
# public/sponsors/ is deliberately absent: its one file is referenced nowhere
# outside the build's own file-trace manifests, so claiming /sponsors/ on the
# shared root would buy nothing.
location ^~ /images/ { include /etc/nginx/snippets/omniroute-public-asset.conf; }
location ^~ /audio/  { include /etc/nginx/snippets/omniroute-public-asset.conf; }

# Favicons / touch icons from layout.tsx metadata and manifest.ts, plus the
# OpenAPI document the docs page links to. Listed explicitly rather than by
# extension so this claims no more of the shared root namespace than it must.
location ~ ^/(?:favicon\.(?:ico|svg)|apple-touch-icon\.(?:png|svg)|icon-192\.svg|icon-512\.png|openapi\.yaml)$ {
    include /etc/nginx/snippets/omniroute-public-asset.conf;
}

#  DELIBERATELY NOT EXPOSED: /sw.js
#
#  PwaRegister.tsx calls navigator.serviceWorker.register("/sw.js"), also
#  root-absolute. Serving it here would register OmniRoute's service worker
#  with scope "/" — i.e. controlling fetches for phpMyAdmin, netdata and
#  every PHP site on this origin, not just the gateway. Today that register()
#  404s and the .catch() in PwaRegister swallows it, so the only cost of
#  leaving it alone is that the PWA stays uninstallable. That is the correct
#  trade until the app asks for /omni/sw.js with an explicit scope.

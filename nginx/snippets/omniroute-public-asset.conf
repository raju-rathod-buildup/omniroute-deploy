# ══════════════════════════════════════════════════════════════════════════
#  Shared body for the OmniRoute public/ asset locations in omniroute.conf.
#
#  Next.js does NOT apply `basePath` to files in public/ — the app must
#  prefix those URLs itself, and upstream OmniRoute does not. So the bundle
#  asks the ORIGIN ROOT for them while the files are only served under /omni.
#  This re-attaches the prefix at the proxy.
#
#  `rewrite ... break` (rather than a URI on proxy_pass) keeps one shared
#  body usable from every location regardless of its prefix or match type.
# ══════════════════════════════════════════════════════════════════════════
rewrite ^ /omni$uri break;

proxy_pass http://127.0.0.1:20128;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

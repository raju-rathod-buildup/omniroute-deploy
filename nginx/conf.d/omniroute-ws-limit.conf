# Caps the OmniRoute live-monitoring WebSocket (/omni/live-ws) per client IP.
# Added 12 Oct 2026 after a reconnect storm: one browser opened ~20 sockets/min
# (vs ~3/hour normally) and left ~71 established on the upstream, burning
# omniroute CPU. Counters live in http context, hence conf.d.
limit_conn_zone $binary_remote_addr zone=omni_ws_conn:1m;
limit_req_zone  $binary_remote_addr zone=omni_ws_req:1m rate=60r/m;
